name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tipos, tests unitarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not db"

  database:
    name: Supabase (RLS, aislamiento, ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
      - run: npm ci
      - run: uv sync --frozen
      - name: Levantar Supabase local
        run: npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime,storage-api,realtime
      - name: Generar .env desde supabase status
        run: |
          eval "$(npx supabase status -o env)"
          cp .env.example .env
          sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=${ANON_KEY}|" .env
          sed -i "s|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}|" .env
          sed -i "s|^SUPABASE_JWT_SECRET=.*|SUPABASE_JWT_SECRET=${JWT_SECRET}|" .env
      - run: npx supabase db lint --level warning --fail-on warning
      - run: uv run pytest -m db

  node:
    name: Node (lint, tipos, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
