[project]
name = "vitrina-api"
version = "0.1.0"
description = "API de Vitrina (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "vitrina-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitrina_api"]
