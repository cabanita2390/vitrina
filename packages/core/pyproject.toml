[project]
name = "vitrina-core"
version = "0.1.0"
description = "Código Python compartido de Vitrina: configuración, proveedores, cola y presupuesto."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "arq>=0.26",
  "anthropic>=0.40",
  "httpx>=0.28",
  "psycopg[binary,pool]>=3.2",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitrina_core"]
